  body{
    font-family:'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:linear-gradient(180deg, #F0E6FA 0%, #E8D5F5 35%, #F5EEFB 100%);
    min-height:100vh;
    color:var(--ink);
    overflow-x:hidden;
    position:relative;
    font-weight:600;
  }

  /* ============ AMBIENT AURORA ============ */
  .aurora-bg{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .aurora-blob{
    position:absolute; border-radius:50%;
    filter:blur(60px); opacity:0.35;
    animation:float 18s ease-in-out infinite;
  }
  .aurora-blob.b1{ width:300px; height:300px; background:var(--violet-light); top:-80px; left:-60px; }
  .aurora-blob.b2{ width:260px; height:260px; background:var(--gold); opacity:0.18; top:40%; right:-80px; animation-delay:6s; }
  .aurora-blob.b3{ width:240px; height:240px; background:var(--pink-cloud); bottom:-60px; left:20%; animation-delay:3s; }
  @keyframes float{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(20px,-30px) scale(1.08); }
  }
  .sparkle{
    position:absolute; width:4px; height:4px;
    background:var(--gold); border-radius:50%;
    opacity:0.6; animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.2; transform:scale(1); }
    50%{ opacity:0.9; transform:scale(1.6); }
  }

  /* ============ ЗОЛОТЫЕ ПЧЁЛКИ (бренд-мотив улья) ============ */
  .bee{
    position:absolute; width:26px; height:26px; opacity:0.85;
    filter:drop-shadow(0 2px 4px rgba(196,160,96,0.4));
    animation:bee-fly var(--fly-dur,26s) ease-in-out infinite;
    animation-delay:var(--fly-delay,0s);
  }
  .bee svg{ width:100%; height:100%; overflow:visible; }
  .bee .wing{ transform-origin:50% 85%; animation:wing-flap 0.18s ease-in-out infinite alternate; }
  .bee .wing.right{ animation-delay:0.09s; }
  @keyframes wing-flap{ from{ transform:rotate(-14deg); } to{ transform:rotate(14deg); } }
  .bee .body-group{ animation:bee-bob 1.6s ease-in-out infinite; }
  @keyframes bee-bob{
    0%,100%{ transform:translateY(0) rotate(-3deg); }
    50%{ transform:translateY(-3px) rotate(3deg); }
  }
  @keyframes bee-fly{
    0%  { transform:translate(-8vw,15vh) rotate(8deg); }
    20% { transform:translate(25vw,8vh) rotate(-6deg); }
    40% { transform:translate(60vw,22vh) rotate(10deg); }
    55% { transform:translate(85vw,12vh) rotate(-4deg); }
    70% { transform:translate(55vw,35vh) rotate(6deg); }
    85% { transform:translate(20vw,28vh) rotate(-8deg); }
    100%{ transform:translate(-8vw,15vh) rotate(8deg); }
  }
  @keyframes bee-fly-2{
    0%  { transform:translate(105vw,55vh) rotate(-8deg) scale(0.8); }
    25% { transform:translate(70vw,68vh) rotate(6deg) scale(0.8); }
    50% { transform:translate(35vw,58vh) rotate(-10deg) scale(0.8); }
    75% { transform:translate(10vw,72vh) rotate(4deg) scale(0.8); }
    100%{ transform:translate(105vw,55vh) rotate(-8deg) scale(0.8); }
  }
  @keyframes bee-fly-3{
    0%  { transform:translate(50vw,105vh) rotate(5deg) scale(0.65); }
    30% { transform:translate(80vw,80vh) rotate(-7deg) scale(0.65); }
    60% { transform:translate(30vw,85vh) rotate(9deg) scale(0.65); }
    100%{ transform:translate(50vw,105vh) rotate(5deg) scale(0.65); }
  }
  .bee.b-2{ animation-name:bee-fly-2; }
  .bee.b-3{ animation-name:bee-fly-3; }

  /* ============ СИЛУЭТЫ У ОБОЧИНЫ (параллакс) ============ */
  .horizon{
    position:fixed; left:0; right:0; bottom:0; height:120px;
    z-index:0; pointer-events:none; overflow:hidden;
  }
  .horizon svg{ position:absolute; bottom:0; left:0; width:200%; height:100%; }
  .horizon .layer-far{ opacity:0.22; will-change:transform; }
  .horizon .layer-near{ opacity:0.34; will-change:transform; }

  /* ============ СОТЫ-РАЗДЕЛИТЕЛЬ ============ */
  .honeycomb-divider{
    display:flex; justify-content:center; align-items:center;
    gap:6px; margin:2px 0 18px;
  }
  .honeycomb-divider svg{ opacity:0.7; }

  /* ============ ДОРОГА ============ */
  .road{
    position:fixed; left:16px; top:0; bottom:0; width:4px; z-index:1;
    pointer-events:none;
  }
  .road-track{
    position:absolute; inset:0;
    background:repeating-linear-gradient(
      180deg,
      rgba(196,160,96,0.22) 0 14px,
      transparent 14px 26px
    );
    border-radius:4px;
  }
  .road-fill{
    position:absolute; top:0; left:0; right:0; height:0%;
    background:linear-gradient(180deg, var(--gold), var(--gold-soft));
    border-radius:4px;
    box-shadow:0 0 12px rgba(196,160,96,0.55);
    transition:height 0.1s linear;
  }
  .road-bee{
    position:absolute; left:-15px; top:0; width:34px; height:34px;
    filter:drop-shadow(0 2px 6px rgba(196,160,96,0.5));
    transition:top 0.1s linear;
  }
  .road-bee svg{ width:100%; height:100%; overflow:visible; }

  /* ============ APP ============ */
  .app{
    position:relative; z-index:2;
    max-width:520px; margin:0 auto;
    padding:14px 16px 60px 40px;
  }

  /* ============ SWITCHERS ============ */
  .switches{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:14px; }
  .seg-control{
    position:relative; display:inline-flex;
    background:rgba(255,255,255,0.6);
    border:1.5px solid rgba(196,160,96,0.35);
    border-radius:50px; padding:4px; gap:2px;
  }
  .seg-control button{
    position:relative; z-index:1; border:none; background:transparent;
    padding:8px 16px; font-size:13px; font-weight:800;
    color:var(--ink-soft); border-radius:50px; cursor:pointer;
    transition:color 0.2s ease;
    -webkit-tap-highlight-color:transparent;
    font-family:inherit; white-space:nowrap;
  }
  .seg-control button.active{ color:#fff; }
  .seg-indicator{
    position:absolute; top:4px; bottom:4px; left:4px; width:56px;
    background:linear-gradient(135deg,var(--violet-deep),var(--violet-light));
    border-radius:50px; transition:transform 0.25s ease, width 0.25s ease;
    box-shadow:0 4px 14px rgba(155,108,196,0.4);
  }
  /* развилка: три указателя города */
  .seg-city button{ padding:9px 14px; font-size:12px; letter-spacing:0.4px; }
  .seg-city .seg-indicator{
    background:linear-gradient(135deg,var(--gold),var(--gold-soft));
    box-shadow:0 4px 14px rgba(196,160,96,0.45);
  }
  .fork-hint{
    display:flex; align-items:center; gap:6px;
    font-size:11px; font-weight:700; color:var(--ink-soft);
    opacity:0.65; letter-spacing:0.5px; text-transform:uppercase;
  }
  .fork-hint svg{ width:13px; height:13px; }

  /* ============ HEADER ============ */
  .header{ text-align:center; padding:4px 0 18px; }
  .header .lotus-mark{
    width:80px; height:80px; margin:0 auto 12px;
    border-radius:50%; overflow:hidden;
    box-shadow:var(--shadow-card);
    border:1.5px solid rgba(196,160,96,0.5);
  }
  .header .lotus-mark img{ width:100%; height:100%; object-fit:cover; display:block; }
  .header h1{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-weight:700; font-size:27px;
    color:var(--violet-deep); letter-spacing:0.3px; line-height:1.15;
  }
  .header .places{
    margin-top:7px; font-size:12px;
    color:var(--gold); font-weight:800; letter-spacing:1.6px;
  }
  .header .brandline{
    margin-top:4px; font-size:12px;
    color:var(--ink-soft); font-weight:700; letter-spacing:1.5px;
  }

  /* ============ SOS ============ */
  .sos{
    background:linear-gradient(155deg, rgba(255,255,255,0.86), rgba(232,213,245,0.6));
    border:1.5px solid rgba(196,160,96,0.55);
    border-radius:var(--radius-lg);
    padding:13px 15px; margin-bottom:14px;
    box-shadow:var(--shadow-card);
  }
  .sos-head{ display:flex; align-items:center; gap:7px; margin-bottom:4px; }
  .sos-head svg{ width:17px; height:17px; flex-shrink:0; }
  .sos-head h2{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-size:16px; font-weight:700; color:var(--gold);
  }
  .sos-row{
    display:flex; align-items:baseline; gap:8px;
    padding:5px 0; border-top:1px solid rgba(196,160,96,0.13);
  }
  .sos-row:first-of-type{ border-top:none; }
  .sos-num{
    font-family:'Manrope', sans-serif;
    font-weight:800; font-size:13.5px; color:var(--violet-deep);
    min-width:74px; text-decoration:none; flex-shrink:0;
    letter-spacing:-0.1px;
    background:transparent; border:none; padding:0; margin:0;
    cursor:pointer; -webkit-appearance:none; appearance:none;
    text-align:left; -webkit-tap-highlight-color:transparent;
  }
  .sos-num:active{ opacity:0.6; }
  .sos-txt{ font-size:11.5px; font-weight:600; color:var(--ink); line-height:1.3; }
  .sos-note{
    margin-top:7px; font-size:10px; font-weight:600;
    color:var(--ink-soft); line-height:1.35; opacity:0.85;
  }

  /* ============ TOGGLE ALL ============ */
  .toolbar{ display:flex; justify-content:flex-end; margin-bottom:10px; }
  .toolbar button{
    font-family:inherit; font-weight:700; font-size:12px; color:var(--violet-deep);
    background:rgba(255,255,255,0.55); border:1.3px solid rgba(196,160,96,0.3);
    border-radius:50px; padding:7px 16px; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .toolbar button:active{ transform:scale(0.96); }

  /* ============ ACCORDION = ДОРОЖНЫЕ УКАЗАТЕЛИ ============ */
  .acc{
    background:rgba(255,255,255,0.72);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1.5px solid rgba(196,160,96,0.35);
    border-radius:var(--radius-lg);
    margin-bottom:13px; overflow:hidden;
    box-shadow:var(--shadow-card);
    position:relative;
  }
  /* веха на дороге слева */
  .acc::before{
    content:""; position:absolute; left:-27px; top:31px;
    width:11px; height:11px; border-radius:50%;
    background:var(--white); border:2.5px solid var(--gold);
    box-shadow:0 0 0 3px rgba(240,230,250,0.9);
  }
  .acc.open::before{ background:var(--gold); }

  .acc-head{
    width:100%; display:flex; align-items:center; gap:13px;
    background:transparent; border:none; cursor:pointer;
    padding:16px 15px; text-align:left; font-family:inherit;
    -webkit-tap-highlight-color:transparent;
  }
  .acc-head:active{ transform:scale(0.985); }
  .acc-icon{
    width:48px; height:48px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--lavender),var(--pink-cloud));
    border-radius:15px; border:1px solid rgba(196,160,96,0.25);
  }
  .acc-icon svg{ width:26px; height:26px; }
  .acc-t{ flex:1; min-width:0; }
  .acc-t h3{
    font-size:16px; font-weight:800; color:var(--ink);
    line-height:1.22; letter-spacing:-0.2px;
  }
  .acc-t p{
    font-size:12px; font-weight:600; color:var(--ink-soft);
    line-height:1.35; margin-top:2px;
  }
  .chev{
    width:20px; height:20px; flex-shrink:0; color:var(--gold);
    transition:transform 0.3s ease;
  }
  .acc.open .chev{ transform:rotate(180deg); }

  .acc-body{ max-height:0; overflow:hidden; transition:max-height 0.4s cubic-bezier(.4,0,.2,1); }
  .acc-inner{ padding:0 15px 16px; }

  /* ============ PLACE CARD = СЪЕЗД С ТРАССЫ ============ */
  .place{
    background:rgba(255,255,255,0.6);
    border:1px solid rgba(196,160,96,0.28);
    border-radius:var(--radius-md);
    padding:13px 14px; margin-bottom:9px;
  }
  .place-n{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-size:18px; font-weight:700; color:var(--violet-deep);
    line-height:1.2; margin-bottom:3px;
  }
  .place-a{
    font-size:12px; font-weight:700; color:var(--gold);
    margin-bottom:5px; letter-spacing:0.2px;
  }
  .place-d{ font-size:13.5px; font-weight:600; color:var(--ink); line-height:1.5; }
  .place-d b{ color:var(--violet-deep); font-weight:800; }
  .btn-row{ display:flex; gap:7px; margin-top:10px; flex-wrap:wrap; }
  .act{
    display:inline-flex; align-items:center; gap:5px;
    background:rgba(255,255,255,0.85);
    border:1.2px solid rgba(196,160,96,0.4);
    border-radius:50px; padding:7px 13px;
    font-size:12px; font-weight:800; color:var(--violet-deep);
    text-decoration:none; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform 0.15s ease;
    font-family:inherit; -webkit-appearance:none; appearance:none;
  }
  .act:active{ transform:scale(0.94); }
  .act svg{ width:13px; height:13px; flex-shrink:0; }

  /* заметка внутри секции */
  .note{
    display:flex; gap:9px; align-items:flex-start;
    background:linear-gradient(135deg, rgba(196,160,96,0.1), rgba(232,213,245,0.35));
    border:1px solid rgba(196,160,96,0.3);
    border-radius:var(--radius-md);
    padding:12px 13px; margin-bottom:9px;
  }
  .note svg{ width:17px; height:17px; flex-shrink:0; margin-top:1px; }
  .note p{ font-size:13.5px; font-weight:600; color:var(--ink); line-height:1.5; }
  .note b{ color:var(--violet-deep); font-weight:800; }
  .note a{ color:var(--violet-deep); font-weight:800; border-bottom:1px solid var(--gold); text-decoration:none; }

  /* ссылки — вплетены прямо в карточку, без отдельных плашек */
  .inline-links{
    display:flex; flex-wrap:wrap; justify-content:center;
    column-gap:14px; row-gap:6px; align-items:center;
    font-size:12.5px; font-weight:700; color:var(--ink-soft);
    background:rgba(255,255,255,0.5);
    border:1px solid rgba(196,160,96,0.28);
    border-radius:var(--radius-md);
    padding:10px 12px; margin-bottom:9px;
  }
  .inline-links a{
    color:var(--violet-deep); font-weight:800;
    text-decoration:none; border-bottom:1px solid var(--gold);
    white-space:nowrap; max-width:100%;
    overflow:hidden; text-overflow:ellipsis;
  }
  .inline-links .sep{ display:none; }

  /* ============ SHARE ============ */
  .share{
    text-align:center;
    background:linear-gradient(155deg, rgba(255,255,255,0.85), rgba(232,213,245,0.55));
    border:1.5px solid rgba(196,160,96,0.5);
    border-radius:var(--radius-lg);
    padding:20px 16px; margin-top:6px;
    box-shadow:var(--shadow-card);
  }
  .share h2{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-size:23px; font-weight:700; color:var(--gold); margin-bottom:7px;
  }
  .share p{ font-size:13.5px; font-weight:600; color:var(--ink); line-height:1.5; margin-bottom:15px; }
  .action-btn{
    position:relative; overflow:hidden;
    display:block; width:100%;
    background:linear-gradient(135deg,var(--violet-deep),var(--violet-light));
    color:#fff; border:none; border-radius:50px;
    padding:15px 20px; font-family:inherit;
    font-size:15px; font-weight:800; cursor:pointer;
    box-shadow:0 8px 24px rgba(155,108,196,0.4);
    -webkit-tap-highlight-color:transparent;
    margin-bottom:9px;
  }
  .action-btn:active{ transform:scale(0.97); }
  .btn-ghost{
    display:block; width:100%;
    background:transparent; border:1.3px solid rgba(196,160,96,0.45);
    border-radius:50px; padding:12px 20px;
    font-family:inherit; font-size:13.5px; font-weight:800;
    color:var(--violet-deep); cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .btn-ghost:active{ transform:scale(0.97); }
  .toast{
    margin-top:11px; font-size:12.5px; font-weight:800; color:var(--gold);
    height:1em; opacity:0; transition:opacity 0.3s ease;
  }
  .toast.on{ opacity:1; }

  /* ============ SNACKBAR — подтверждение копирования ============ */
  .snackbar{
    position:fixed; left:50%; bottom:22px; z-index:60;
    transform:translateX(-50%) translateY(16px);
    background:var(--ink); color:#fff;
    padding:11px 20px; border-radius:999px;
    font-family:'Manrope', sans-serif; font-size:13px; font-weight:700;
    opacity:0; pointer-events:none;
    box-shadow:0 12px 30px rgba(0,0,0,0.28);
    transition:opacity 0.25s ease, transform 0.25s ease;
    max-width:86%; text-align:center;
  }
  .snackbar.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ============ HARMONY CTA — главная кнопка знакомства ============ */
  .cta-wrap{ text-align:center; margin:14px 0 4px; }
  .cta-btn{
    position:relative; overflow:hidden;
    display:inline-flex; align-items:center; justify-content:center; gap:9px;
    width:100%; box-sizing:border-box;
    background:linear-gradient(135deg, var(--gold), var(--violet-deep) 70%);
    background-size:220% 220%;
    color:#fff; border:none; border-radius:50px;
    padding:17px 22px; font-family:inherit;
    font-size:15.5px; font-weight:800; letter-spacing:0.2px; cursor:pointer;
    text-decoration:none;
    box-shadow:0 10px 30px rgba(155,108,196,0.45), 0 0 0 1px rgba(255,255,255,0.25) inset;
    -webkit-tap-highlight-color:transparent;
    animation:cta-glow 5s ease-in-out infinite;
  }
  .cta-btn svg{ width:19px; height:19px; flex-shrink:0; stroke:#fff; }
  .cta-btn:active{ transform:scale(0.97); }
  @keyframes cta-glow{
    0%,100%{ background-position:0% 50%; box-shadow:0 10px 30px rgba(155,108,196,0.45), 0 0 0 1px rgba(255,255,255,0.25) inset; }
    50%{ background-position:100% 50%; box-shadow:0 10px 38px rgba(196,160,96,0.55), 0 0 0 1px rgba(255,255,255,0.3) inset; }
  }
  @media (prefers-reduced-motion: reduce){ .cta-btn{ animation:none; } }

  /* ============ FOOTER ============ */
  footer{ text-align:center; padding-top:22px; }
  .proverb{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-style:italic; font-size:18px; color:var(--ink-soft);
    line-height:1.4; margin-bottom:10px;
  }
  .upd{ font-size:11.5px; font-weight:600; color:var(--ink-soft); opacity:0.75; line-height:1.55; margin-bottom:16px; }
  .brand{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-weight:700; letter-spacing:3px; font-size:13px;
    color:var(--gold); text-transform:uppercase;
  }
  .ytunnus{ font-size:10.5px; font-weight:600; color:var(--ink-soft); opacity:0.6; margin-top:5px; letter-spacing:0.5px; }

  @media (prefers-reduced-motion: reduce){
    .aurora-blob, .sparkle, .bee, .bee *{ animation:none !important; }
    html{ scroll-behavior:auto; }
  }
  :focus-visible{ outline:2px solid var(--violet-deep); outline-offset:2px; border-radius:10px; }
</style>
</head>

  {k:"n", i:"star", h:"<b>tapahtumienkainuu.fi</b> — the single calendar for everything in Kainuu. One link instead of ten: city, parishes, Sotkamo."},

 kaiku:{t:"Kaikukortti", s:"culture for free", i:[
  {k:"n", h:"Gives <b>free tickets</b> to theatre, museums, concerts and festivals — plus places on adult education courses."},
  {k:"n", i:"star", h:"<b>No proof of income needed.</b> Just ask your social or health service worker for the card."},
  {k:"n", h:"For whom: a client of a participating Kainuu service, in a tight financial situation, aged 16+. Tickets for under-16s too, if you go together. Valid across Finland."},
  {k:"l", u:"https://www.kaikukortti.fi", l:"kaikukortti.fi"}
 ]},
 courses:{t:"Courses & hobbies", s:"languages, art, music, sport", i:[
  {k:"p", p:"opisto", d:"Open to everyone. Languages, visual arts, crafts, sport, IT, music. <b>Free public lectures — no registration.</b>"},
  {k:"n", i:"star", h:"<b>Opintoseteli</b> — a discount on course fees for the unemployed, pensioners and people who have moved to Finland. Just ask when you enrol."},
  {k:"n", i:"star", h:"For Russian speakers there are <b>English courses taught in Russian</b>."},
  {k:"n", h:"There is also <b>Kaikukortti</b> — a card giving free access to some courses and culture for those in a tight financial spot right now. Ask your social worker for details."},
  {k:"p", p:"sOpisto", d:"Sotkamo's own adult education centre."}
 ]},
 secrets:{t:"Local secrets", s:"what the brochures don't tell you", i:[
  {k:"n", i:"star", h:"<b>Bottles are money.</b> Deposit (pantti) 10–40 cents. Machine at the shop entrance, the receipt is accepted at the till. Don't throw them away."},
  {k:"n", i:"warn", h:"<b>Bank cards don't work on the bus.</b> Only a Waltti card, the Waltti Mobiili app, or cash."},
  {k:"n", h:"<b>Both Kajaani museums are free.</b> Just walk in."},
  {k:"n", h:"<b>The library is completely free</b> — even the library card."},
  {k:"n", h:"<b>The forest belongs to everyone.</b> Blueberries, lingonberries, cloudberries — tonnes of free food every autumn."},
  {k:"n", h:"<b>Fishing in the middle of Kajaani</b> — by the castle ruins people catch trout, grayling and whitefish almost all year."},
  {k:"n", h:"<b>S-Etukortti and K-Plussa</b> are free and noticeably lower the price at the till."},
  {k:"n", h:"<b>ResQ Club</b> and similar apps — fresh food from cafés and shops at a fraction of the price."}
 ]},
 seasons:{t:"Life by the seasons", s:"how to get through winter", i:[
  {k:"n", h:"<b>Winter.</b> Dress in layers; a hat and warm shoes are essential. <b>Kaamos</b> is the dark season of the North. What helps: vitamin D, a bright-light lamp, movement and — above all — people around you."},
  {k:"n", h:"<b>Summer.</b> White nights and lots of light. Bring repellent — Kainuu's mosquitoes mean business."},
  {k:"n", h:"<b>Autumn.</b> Berry and mushroom season — the best time for the forest."},
  {k:"n", i:"star", h:"The dark months are lighter together. Come to HARMONY meetings."}
 ]},
 harmony:{t:"HARMONY & community", s:"where to come, who to be with", i:[
  {k:"n", h:"This guide wasn't written by officials — it was put together by fellow Kainuu residents, the non-profit organisation <b>HARMONY LIFE</b>."},
  {k:"cta", u:TG_BOT_LINK, l:"Meet HARMONY"}
 ]}

let LANG = "ru", CITY = "kajaani", allOpen = false;
const el = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function mapUrl(g){
  const [coords, pid] = g.split("|");
  let u = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(coords);
  if(pid) u += "&query_place_id=" + encodeURIComponent(pid);
  return u;
}

function svg(id, cls){ return '<svg'+(cls?' class="'+cls+'"':'')+'><use href="#'+id+'"/></svg>'; }

function renderPlace(key, desc, ui){
  const pl = P[key];
  if(!pl) return "";
  let h = '<div class="place">';
  h += '<div class="place-n">'+esc(pl.n)+'</div>';
  if(pl.a) h += '<div class="place-a">'+esc(pl.a)+'</div>';
  if(desc) h += '<div class="place-d">'+desc+'</div>';
  let btns = '';
  if(pl.g) btns += '<a class="act" href="'+mapUrl(pl.g)+'" target="_blank" rel="noopener">'+svg("ic-pin")+ui.map+'</a>';
  if(pl.w) btns += '<a class="act" href="'+pl.w+'" target="_blank" rel="noopener">'+svg("ic-web")+ui.site+'</a>';
  if(btns) h += '<div class="btn-row">'+btns+'</div>';
  h += '</div>';
  return h;
}

const ACT = {
  ru:{map:"Карта", call:"Скопировать номер", site:"Сайт", copied:"Номер скопирован"},
  fi:{map:"Kartta", call:"Kopioi numero", site:"Sivut", copied:"Numero kopioitu"},
  en:{map:"Map", call:"Copy number", site:"Website", copied:"Number copied"},
  uk:{map:"Карта", call:"Скопіювати номер", site:"Сайт", copied:"Номер скопійовано"}
};

function renderSection(sec, ic, ui){
  let inner = "";
  let lastBlockOpen = false; // whether the previous emitted block can receive an attached link line
  let linkBuf = [];

  const closeLinkBuf = () => {
    if(!linkBuf.length) return;
    const linksInner = linkBuf.map((x,i) =>
      (i>0 ? '<span class="sep">·</span>' : '') + '<a href="'+x.u+'" target="_blank" rel="noopener">'+esc(x.l)+'</a>'
    ).join("");
    inner += '<div class="inline-links standalone">'+linksInner+'</div>';
    linkBuf = [];
  };

  sec.i.forEach(it => {
    if(it.k === "l"){ linkBuf.push(it); return; }
    closeLinkBuf();
    if(it.k === "n"){
      const icon = it.i === "warn" ? "ic-warn" : (it.i === "star" ? "ic-star" : "ic-hex");
      inner += '<div class="note">'+svg(icon)+'<p>'+it.h+'</p></div>';
      lastBlockOpen = true;
    } else if(it.k === "p"){
      inner += renderPlace(it.p, it.d, ui);
      lastBlockOpen = true;
    } else if(it.k === "cta"){
      inner += '<div class="cta-wrap"><a class="cta-btn" href="'+it.u+'" target="_blank" rel="noopener">'+svg("ic-heart")+esc(it.l)+'</a></div>';
      lastBlockOpen = false;
    }
  });
  closeLinkBuf();

  return '<div class="acc">'
    + '<button class="acc-head" aria-expanded="false">'
    +   '<span class="acc-icon">'+svg(ic)+'</span>'
    +   '<span class="acc-t"><h3>'+esc(sec.t)+'</h3><p>'+esc(sec.s)+'</p></span>'
    +   svg("ic-chev","chev")
    + '</button>'
    + '<div class="acc-body"><div class="acc-inner">'+inner+'</div></div>'
    + '</div>';
}

function render(){
  const D = I18N[LANG], ui = D.ui, act = ACT[LANG];
  document.documentElement.lang = LANG;

  el("hTitle").innerHTML = ui.title;
  el("forkLabel").textContent = ui.fork;
  el("sosTitle").textContent = ui.sosTitle;
  el("sosNote").textContent = ui.sosNote;
  el("btnAll").textContent = allOpen ? ui.close : ui.open;
  el("shTitle").textContent = ui.shTitle;
  el("shText").textContent = ui.shText;
  el("btnShare").textContent = ui.shBtn;
  el("btnCopy").textContent = ui.copyBtn;
  el("upd").textContent = ui.upd;
  el("toast").textContent = ""; el("toast").classList.remove("on");

  el("sosRows").innerHTML = D.sos.map(s =>
    '<div class="sos-row"><button type="button" class="sos-num act-copy" data-copy="'+esc(s.n)+'" data-copied="'+esc(ACT[LANG].copied)+'">'+esc(s.n)+'</button>'
    + '<span class="sos-txt">'+esc(s.t)+'</span></div>'
  ).join("");

  el("acc").innerHTML = ORDER.map(o => {
    const sec = (o.scope === "common") ? D.common[o.id] : D.cities[CITY][o.id];
    return sec ? renderSection(sec, o.ic, act) : "";
  }).join("");

  bindAcc();
  if(allOpen) setAll(true);
  requestAnimationFrame(updateRoad);
}

function bindAcc(){
  document.querySelectorAll(".acc").forEach(item => {
    const head = item.querySelector(".acc-head");
    const body = item.querySelector(".acc-body");
    head.addEventListener("click", () => {
      const open = item.classList.toggle("open");
      head.setAttribute("aria-expanded", open ? "true" : "false");
      body.style.maxHeight = open ? body.scrollHeight + "px" : null;
      setTimeout(updateRoad, 420);
    });
  });
}

function setAll(open){
  document.querySelectorAll(".acc").forEach(item => {
    const head = item.querySelector(".acc-head");
    const body = item.querySelector(".acc-body");
    if(open){
      item.classList.add("open");
      head.setAttribute("aria-expanded","true");
      body.style.maxHeight = body.scrollHeight + "px";
    } else {
      item.classList.remove("open");
      head.setAttribute("aria-expanded","false");
      body.style.maxHeight = null;
    }
  });
  setTimeout(updateRoad, 420);
}

/* ---------- ДОРОГА: заполнение по скроллу + пчела-проводник ---------- */
function updateRoad(){
  const h = document.documentElement.scrollHeight - window.innerHeight;
  const pct = h > 0 ? Math.min(100, Math.max(0, (window.scrollY / h) * 100)) : 0;
  el("roadFill").style.height = pct + "%";
  el("roadBee").style.top = "calc(" + pct + "% - 17px)";

  const off = window.scrollY;
  const far = el("layerFar"), near = el("layerNear");
  if(far)  far.style.transform  = "translateX(" + (-(off * 0.03) % 800) + "px)";
  if(near) near.style.transform = "translateX(" + (-(off * 0.07) % 800) + "px)";
}

/* ---------- ПЕРЕКЛЮЧАТЕЛИ ---------- */
function moveInd(seg, ind){
  const btn = seg.querySelector("button.active");
  if(!btn) return;
  ind.style.width = btn.offsetWidth + "px";
  ind.style.transform = "translateX(" + (btn.offsetLeft - 4) + "px)";
}
function moveAll(){
  moveInd(el("segLang"), el("indLang"));
  moveInd(el("segCity"), el("indCity"));
}

el("segLang").querySelectorAll("button").forEach(b => {
  b.addEventListener("click", () => {
    el("segLang").querySelectorAll("button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    LANG = b.dataset.lang;
    moveAll(); render();
  });
});
el("segCity").querySelectorAll("button").forEach(b => {
  b.addEventListener("click", () => {
    el("segCity").querySelectorAll("button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    CITY = b.dataset.city;
    moveAll(); render();
  });
});

el("btnAll").addEventListener("click", () => {
  allOpen = !allOpen;
  setAll(allOpen);
  el("btnAll").textContent = allOpen ? I18N[LANG].ui.close : I18N[LANG].ui.open;
});

/* реальные ссылки заданы в шапке: SHARE_URL (Mini App) и COPY_URL (веб) */
function flash(){
  const t = el("toast");
  t.textContent = I18N[LANG].ui.copied;
  t.classList.add("on");
  setTimeout(() => t.classList.remove("on"), 2600);
}

/* ---------- Копирование в буфер (общее) ---------- */
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    try{
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      return true;
    }catch(err){ return false; }
  }
}
function showSnackbar(text){
  const s = el("snackbar");
  s.textContent = text;
  s.classList.add("show");
  clearTimeout(s._t);
  s._t = setTimeout(() => s.classList.remove("show"), 2000);
}
document.addEventListener("click", async (e) => {
  const btn = e.target.closest(".act-copy");
  if(!btn) return;
  const num = btn.getAttribute("data-copy");
  const label = btn.getAttribute("data-copied") || "";
  const ok = await copyText(num);
  if(ok) showSnackbar(label ? (label + ": " + num) : num);
});

el("btnShare").addEventListener("click", async () => {
  const ui = I18N[LANG].ui;
  const tgUrl = "https://t.me/share/url?url=" + encodeURIComponent(SHARE_URL) + "&text=" + encodeURIComponent(ui.shareMsg);
  if(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink){
    window.Telegram.WebApp.openTelegramLink(tgUrl);
    return;
  }
  if(navigator.share){
    try{ await navigator.share({title: ui.title.replace(/<br>/g," "), text: ui.shareMsg, url: SHARE_URL}); return; }catch(e){}
  }
  window.open(tgUrl, "_blank");
});
el("btnCopy").addEventListener("click", async () => {
  const ok = await copyText(COPY_URL);
  if(ok) flash();
});

(function(){

  [{c:"b-1",d:"26s",dl:"0s"},{c:"b-2",d:"34s",dl:"-12s"},{c:"b-3",d:"30s",dl:"-5s"}].forEach(cfg => {

  for(let i=0;i<7;i++){
    const s = document.createElement("div");
    s.className = "sparkle";
    s.style.left = Math.random()*100 + "%";
    s.style.top  = Math.random()*100 + "%";

    bg.appendChild(s);
  }
})();

(function(){

  if(!tg) return;
  try{
    tg.ready(); tg.expand();
    if(tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    if(tg.setHeaderColor) tg.setHeaderColor("#F0E6FA");
    if(tg.setBackgroundColor) tg.setBackgroundColor("#F0E6FA");
  }catch(e){}
  /* отступ сверху под шапку Telegram в полноэкранном режиме */
  try{
    if(tg.isFullscreen || (tg.viewportStableHeight && tg.viewportHeight > tg.viewportStableHeight)){
      document.querySelector(".app").style.paddingTop = "56px";
    }
  }catch(e){}
  /* внешние ссылки — через openLink, телеграмные — через openTelegramLink */
  document.addEventListener("click", e => {
    const a = e.target.closest("a[href^='http']");
    if(!a) return;
    const href = a.getAttribute("href");
    e.preventDefault();
    try{
      if(/^https?:\/\/t\.me\//.test(href) && tg.openTelegramLink){ tg.openTelegramLink(href); }
      else if(tg.openLink){ tg.openLink(href); }
      else{ window.open(href, "_blank"); }
    }catch(err){ window.open(href, "_blank"); }
  });
  const haptic = tg.HapticFeedback;
  if(haptic){
    document.addEventListener("click", e => {
      if(e.target.closest(".acc-head, .act, .sos-num, .cta-btn, .inline-links a, .seg-control button, .action-btn, .btn-ghost")){
        try{ haptic.impactOccurred("light"); }catch(err){}
      }
    });
  }
})();

/* ---------- INIT ---------- */
window.addEventListener("scroll", updateRoad, {passive:true});
window.addEventListener("resize", () => { moveAll(); updateRoad(); });
window.addEventListener("load", () => { moveAll(); updateRoad(); });
render();
setTimeout(moveAll, 60);

</script>
